name: GitOps Delivery

on:
  pull_request:
    branches: [main]
    paths:
      - "argocd/**"
      - "gitops/**"
      - ".github/workflows/gitops-delivery.yml"
  push:
    branches: [main]
    paths:
      - "argocd/**"
      - "gitops/**"
      - ".github/workflows/gitops-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-production
  cancel-in-progress: false

env:
  ARGOCD_APP: hello-world
  ARGOCD_CLI_VERSION: v3.4.2
  ARGOCD_CLI_ASSET: argocd-darwin-arm64

jobs:
  validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate manifests with kubeconform
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:461fae0fa54c5fe64028152533e57f6b88adb1d26dbafd80092e7310d349ae48 \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /workspace/gitops \
            /workspace/argocd

  deploy:
    name: Sync and verify Argo CD
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, macOS, ARM64, argocd, orbstack]
    timeout-minutes: 20
    environment:
      name: production
    env:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_INSECURE: ${{ vars.ARGOCD_INSECURE || 'false' }}
    steps:
      - name: Check required Argo CD configuration
        run: |
          invalid=false
          if [ -z "$ARGOCD_SERVER" ]; then
            echo "::error::Missing production environment secret ARGOCD_SERVER"
            invalid=true
          fi
          if [ -z "$ARGOCD_AUTH_TOKEN" ]; then
            echo "::error::Missing production environment secret ARGOCD_AUTH_TOKEN"
            invalid=true
          fi
          if [ "$invalid" = "true" ]; then
            echo "Configure the missing secrets in the GitHub production environment."
            echo "See argocd/README.md for the token procedure."
            exit 1
          fi

      - name: Connect runner to the local Argo CD API
        run: |
          kubectl config use-context orbstack
          kubectl -n argocd get service argocd-server
          kubectl -n argocd port-forward \
            service/argocd-server 8080:443 \
            > "$RUNNER_TEMP/argocd-port-forward.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/argocd-port-forward.pid"

          for attempt in {1..30}; do
            if curl --insecure --silent --fail \
              https://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/argocd-port-forward.log"
          echo "::error::Argo CD port-forward did not become ready"
          exit 1

      - name: Install and verify Argo CD CLI
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            --output "$ARGOCD_CLI_ASSET" \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/${ARGOCD_CLI_ASSET}"
          curl --fail --silent --show-error --location \
            --output cli_checksums.txt \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/cli_checksums.txt"
          grep " ${ARGOCD_CLI_ASSET}$" cli_checksums.txt > argocd.sha256
          shasum --algorithm 256 --check argocd.sha256
          mv "$ARGOCD_CLI_ASSET" argocd
          chmod 0755 argocd
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sync the exact Git revision
        run: |
          flags=(
            --server "$ARGOCD_SERVER"
            --auth-token "$ARGOCD_AUTH_TOKEN"
            --grpc-web
          )
          if [ "$ARGOCD_INSECURE" = "true" ]; then
            flags+=(--insecure)
          fi

          argocd app sync "$ARGOCD_APP" \
            "${flags[@]}" \
            --revision "$GITHUB_SHA" \
            --prune \
            --timeout 600

          argocd app wait "$ARGOCD_APP" \
            "${flags[@]}" \
            --sync \
            --health \
            --operation \
            --timeout 600

      - name: Publish Argo CD deployment evidence
        if: >-
          always() && env.ARGOCD_SERVER != '' && env.ARGOCD_AUTH_TOKEN != ''
        run: |
          flags=(
            --server "$ARGOCD_SERVER"
            --auth-token "$ARGOCD_AUTH_TOKEN"
            --grpc-web
          )
          if [ "$ARGOCD_INSECURE" = "true" ]; then
            flags+=(--insecure)
          fi

          echo "## Application status"
          argocd app get "$ARGOCD_APP" "${flags[@]}" --show-operation || true
          echo "## Deployment history"
          argocd app history "$ARGOCD_APP" "${flags[@]}" || true
          echo "## Managed resources"
          argocd app resources "$ARGOCD_APP" "${flags[@]}" || true
          echo "## Application pod logs (last 10 minutes)"
          argocd app logs "$ARGOCD_APP" \
            "${flags[@]}" \
            --since-seconds 600 || true

      - name: Stop the local Argo CD connection
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/argocd-port-forward.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/argocd-port-forward.pid")" || true
          fi
