name: Platform CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pipeline:
    name: Build, Test, and Deploy
    runs-on: portfolio-runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible & Linter
        run: |
          if [ -n "${ANSIBLE_COLLECTIONS_PATHS:-}" ]; then
            export ANSIBLE_COLLECTIONS_PATH="$ANSIBLE_COLLECTIONS_PATHS"
            unset ANSIBLE_COLLECTIONS_PATHS
          fi
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Ansible Lint (CI Phase)
        run: |
          if [ -n "${ANSIBLE_COLLECTIONS_PATHS:-}" ]; then
            export ANSIBLE_COLLECTIONS_PATH="$ANSIBLE_COLLECTIONS_PATHS"
            unset ANSIBLE_COLLECTIONS_PATHS
          fi
          ansible-lint ansible/playbooks

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format & Validate (CI Phase)
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Trigger AWX Deployment (CD Phase)
        run: |
          echo "Triggering AWX Job Template internally..."
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.AWX_TOKEN }}" \
            -H "Content-Type: application/json" \
            http://awx-service.awx.svc.cluster.local/api/v2/job_templates/9/launch/ \
            -d '{}'
