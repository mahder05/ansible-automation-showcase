name: Platform CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pipeline:
    name: Build, Test, and Deploy
    runs-on: portfolio-runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible & Linter
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Run Ansible Lint (CI Phase)
        run: |
          ansible-lint ansible/playbooks/setup-nginx.yml

      - name: Trigger AWX Deployment (CD Phase)
        run: |
          echo "Triggering AWX Job Template 9 internally..."
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.AWX_TOKEN }}" \
            -H "Content-Type: application/json" \
            http://awx-service.awx.svc.cluster.local/api/v2/job_templates/9/launch/ \
            -d '{}'
